
name: Build MISS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate Manifest
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST VALID')"

      - name: Build APK
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee build-log.txt
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "BUILD_STATUS=$BUILD_STATUS"
          exit $BUILD_STATUS

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MISS-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Build Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MISS-AI-build-log
          path: build-log.txt
          if-no-files-found: warn
